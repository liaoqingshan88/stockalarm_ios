#
# Force Commons Logging to use a stable logger on Android.
# Avoids LogFactoryImpl runtime discovery paths that can crash on some devices.
#
org.apache.commons.logging.Log=org.apache.commons.logging.impl.SimpleLog

# Optional: keep output minimal by default (change as needed)
org.apache.commons.logging.simplelog.showdatetime=false
org.apache.commons.logging.simplelog.showlogname=false
org.apache.commons.logging.simplelog.showShortLogname=true
org.apache.commons.logging.simplelog.defaultlog=warn

